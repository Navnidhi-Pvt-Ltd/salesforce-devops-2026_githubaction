name: Common Pipeline
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name'
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latestsf
jobs:
  build:
    name: "Build & Deploy against the Salesforce Org"
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    env:
      PYTHON_VERSION: ${{vars.PYTHON_VERSION}}
      ORG_DEFAULT_ALIAS: ${{vars.ORG_DEFAULT_ALIAS}}
      JAVA_VERSION: ${{vars.JAVA_VERSION}}
      NODE_VERSION: ${{vars.NODE_VERSION}}
      CONSUMER_KEY: ${{secrets.CONSUMER_KEY}}
      ENCRYPTION_KEY: ${{secrets.ENCRYPTION_KEY}} 
      SLACK_API_KEY: ${{secrets.SLACK_API_KEY}}
      TEST_LEVEL: RunSpecifiedTests

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  
  # PREREQUISITES - Only needed if the runner doesn't already satisfy these requirements.
      - name: Ensure node v20.9.0 or greater
        uses: actions/setup-node@v5
        with:
          node-version: ${{env.NODE_VERSION}}
      - name: Ensure java v11 or greater
        uses: actions/setup-java@v5
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'zulu'
      - name: Ensure python v3.10 or greater
        uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}              
      - name: Read PR Body
        run: |
          echo "${{github.event.pull_request.body}}" >> pr_body.txt
          python READ_PRBODY.py > output.txt
          cat output.txt
          echo "apex_test_classes=$(cat output.txt)" >> $GITHUB_ENV
          echo {{env.apex_test_classes}}

      - name: "setup Salesforce CLI"
        run: npm install --global @salesforce/cli@latest

      - name: "Check sf cli version"
        run: sf --version

      - name: "Install Salesforce Code Analyzer"
        run: |
            sf --help    
            sf plugins install code-analyzer
      - name: "Install SFDX GIT Delta"
        run: |
            echo 'Y'| sf plugins install sfdx-git-delta
      - name: "Generate Delta Files"
        run: |
            mkdir delta
            sf sgd source delta --from "HEAD~1" --to "HEAD" --generate-delta --ignore-file .sgdignore --output-dir ./delta --ignore-whitespace --api-version 66.0 --source-dir force-app/main/default 
            cat delta/package/package.xml
            ls delta

  #            - name: "Authenticate with Salesforce"
  #              env: 
  #                PROD_SFDX_AUTH_URL: ${{secrets.PROD_SFDX_AUTH_URL}}
  #                SFDX_AUTH_FILE_PATH: ${{secrets.SFDX_AUTH_FILE_PATH}} 
  #              run: |
  #                # Read the secret
  #                echo $RUNNER_TEMP
  #                echo ${{env.PROD_SFDX_AUTH_URL}}
  #                echo ${{env.PROD_SFDX_AUTH_URL}}>${{env.SFDX_AUTH_FILE_PATH}}
  #                sf org login sfdx-url --sfdx-url-file ${{env.SFDX_AUTH_FILE_PATH}} --set-default --alias ${{env.ORG_DEFAULT_ALIAS}}
  #                rm ${{env.SFDX_AUTH_FILE_PATH}}

      - name: "Decrypt the encrypted file 2"
        run: |
            openssl enc -nosalt --aes-256-cbc -d -in ${{secrets.ENCRYPTION_KEY_FILE}} -out ${{secrets.JWT_KEY_FILE}} -base64 -K ${{secrets.DECRYPTION_KEY}} -iv ${{secrets.DECRYPTION_IV}}

      - name: "Authenticate with Salesforce"
        run: |
            sf org login jwt --client-id ${{secrets.CONSUMER_KEY}} --jwt-key-file ${{secrets.JWT_KEY_FILE}}     --username  ${{secrets.DEPLOYMENT_USER_NAME}}    --set-default --alias ${{vars.ORG_DEFAULT_ALIAS}}     --instance-url ${{vars.HUB_LOGIN_URL}}

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        if: ${{ github.event.pull_request.merged == false && github.event_name == 'pull_request' }}
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}
#gihub.event_name == ''
      - name: "Validate to Salesforce org - with Specific Tests"
        if: ${{ env.apex_test_classes != 'No Apex classes found' && env.apex_test_classes != 'RunRelevantTests' && github.event.pull_request.merged == false && github.event_name == 'pull_request' }}
        run: sf project deploy start --test-level ${{env.TEST_LEVEL}} --tests {{env.apex_test_classes}}  --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45 --dry-run --json 2>&1 | tee deploy_result.json

      - name: "Validate to Salesforce org - Run Relevant Tests"
        if: ${{ env.apex_test_classes == 'RunRelevantTests' && github.event.pull_request.merged == false && github.event_name == 'pull_request' }}
        run: sf project deploy start --test-level ${{env.apex_test_classes}}  --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45 --dry-run

      - name: "Validate to Salesforce org - Default Test Level"
        if: ${{ env.apex_test_classes == 'No Apex classes found' && github.event.pull_request.merged == false && github.event_name == 'pull_request' }}
        run: sf project deploy start --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45 --dry-run

      - name: "Enforce 82% Code Coverage"
        if: ${{ env.apex_test_classes != 'No Apex classes found' && github.event.pull_request.merged == false && github.event_name == 'pull_request' }}
        run: |
          python CODE_COVERAGE.py deploy_result.json

      - name: "Deploy to Salesforce org - with Specific Tests"
        if: ${{ env.apex_test_classes != 'No Apex classes found' && env.apex_test_classes != 'RunRelevantTests' && github.event_name == 'push' }}
        run: sf project deploy start --test-level ${{env.TEST_LEVEL}} --tests {{env.apex_test_classes}}  --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45


      - name: "Deploy to Salesforce org - Run Relevant Tests"
        if: ${{ env.apex_test_classes == 'RunRelevantTests' && github.event_name == 'push' }}
        run: sf project deploy start --test-level ${{env.apex_test_classes}}  --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45


      - name: "Deploy to Salesforce org - Default Test Level"
        if: ${{ env.apex_test_classes == 'No Apex classes found' && github.event_name == 'push' }}
        run: sf project deploy start --source-dir delta/force-app/main/default --target-org ${{env.ORG_DEFAULT_ALIAS}} --wait 45


      - name: Fail on Critical/High Violations (All Files)
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 30 ||
          steps.run-code-analyzer.outputs.num-sev2-violations > 30 
        run: exit 1
      - name: Slack Action Message
        uses: hbfernandes/slack-action@1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
              status: "${{ job.status }}"
              option: "false

