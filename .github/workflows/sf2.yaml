name: "Salesforce Pipeline"
run-name: "Salesforce Pipeline Run"

on:
  push:
jobs:
  setup-salesforce:
      name: "Setup Salesforce Environment"
      runs-on: ubuntu-latest

      steps:
            - name: 'Checkout Code'
              uses: actions/Checkoutv6.0
              with:
                fetch-depth: 0            
            - name: "setup Salesforce CLI"
              run: npm install --global @salesforce/cli@latest

            - name: "Check sf cli version"
              run: sf --version

            - name: "Install Salesforce Code Analyzer"
              run: |
                  sf --help    
                  sf plugins install code-analyzer
            - name: "Authenticate with Salesforce"
              run: sf org login sfdx-url --sfdx-url-file tmp/authFile.txt --set-default --alias TRIAL_PROD_ORG